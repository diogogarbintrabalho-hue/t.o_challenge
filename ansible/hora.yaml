---
- name: Deploy da Primeira Aplicação (Python) com Restrição de IP e Cache Nginx
  hosts: ec2
  become: true

  vars:
    repo_url: "https://github.com/diogogarbintrabalho-hue/t.o_challenge.git"
    app_dir: "/var/www/python_app"

  tasks:
    - name: Atualizar pacotes do sistema
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar dependencias do sistema (Python, Git, Nginx)
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - nginx
        state: present

    # Descobre o IP público da sua máquina local que executa o Ansible
    - name: Obter IP público local
      delegate_to: localhost
      become: false
      uri:
        url: https://api.ipify.org?format=json
        return_content: yes
      register: meu_ip_local

    - name: Clonar ou atualizar o repositorio da aplicacao
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
        accept_hostkey: yes

    - name: Criar ambiente virtual Python (venv) e instalar requisitos
      pip:
        requirements: "{{ app_dir }}/apps/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Criar servico systemd para a aplicacao Flask (Python)
      copy:
        dest: /etc/systemd/system/python_app.service
        content: |
          [Unit]
          Description=Gunicorn Application Server (hora.py)
          After=network.target

          [Service]
          User=www-data
          Group=www-data
          WorkingDirectory={{ app_dir }}/apps
          ExecStart={{ app_dir }}/venv/bin/gunicorn --workers 3 --bind 127.0.0.1:5000 hora:app
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Iniciar e habilitar o servico Python
      systemd:
        name: python_app
        state: restarted
        daemon_reload: yes
        enabled: yes

    - name: Configurar Nginx com Restrição por IP e Cache de 1m na Aplicação Python
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          # Zona de cache Nginx para a aplicação Python
          proxy_cache_path /var/cache/nginx/python levels=1:2 keys_zone=PYTHON_CACHE:10m max_size=500m inactive=60m use_temp_path=off;

          server {
              listen 80;
              server_name _;

              # Aplicação Python (RESTRITA AO SEU IP ATUAL + CACHE DE 1m)
              location / {
                  # Libera apenas o seu IP descoberto dinamicamente
                  allow {{ meu_ip_local.json.ip }};
                  
                  # Bloqueia todos os outros IPs da internet
                  deny all;

                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;

                  proxy_cache PYTHON_CACHE;
                  proxy_cache_valid 200 1m;
                  add_header X-Cache-Status $upstream_cache_status;
              }
          }

    - name: Reiniciar Nginx para aplicar as regras
      service:
        name: nginx
        state: restarted
        enabled: yes
