- name: Deploy da Aplicação Python + Nginx Cache na EC2
  hosts: ec2
  become: true

  vars:
    repo_url: "https://github.com/diogogarbintrabalho-hue/t.o_challenge.git"
    app_dir: "/var/www/python_app"

  tasks:
    - name: Atualizar pacotes do sistema
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar dependencias do sistema (Python, Git, Nginx)
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - nginx
        state: present

    - name: Clonar ou atualizar o repositorio da aplicacao
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Criar ambiente virtual Python (venv) e instalar requisitos
      pip:
        requirements: "{{ app_dir }}/apps/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Criar servico systemd para a aplicacao Flask (Gunicorn)
      copy:
        dest: /etc/systemd/system/python_app.service
        content: |
          [Unit]
          Description=Gunicorn Application Server (hora.py)
          After=network.target

          [Service]
          User=www-data
          Group=www-data
          WorkingDirectory={{ app_dir }}/apps
          ExecStart={{ app_dir }}/venv/bin/gunicorn --workers 3 --bind 127.0.0.1:5000 hora:app
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Iniciar e habilitar o serviço da aplicacao
      systemd:
        name: python_app
        state: restarted
        daemon_reload: yes
        enabled: yes

    - name: Configurar Nginx com camada de Cache de 1 minuto
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          # Define a zona de cache na memória (10MB) e pasta em disco
          proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=MY_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;

                  # Habilita o Cache para respostas 200 OK durante 1 minuto (60s)
                  proxy_cache MY_CACHE;
                  proxy_cache_valid 200 1m;
                  
                  # Retorna um header HTTP para verificar se o Nginx usou Cache (HIT) ou Python (MISS)
                  add_header X-Cache-Status $upstream_cache_status;
              }
          }

    - name: Reiniciar Nginx para aplicar as alterações
      service:
        name: nginx
        state: restarted
        enabled: yes
